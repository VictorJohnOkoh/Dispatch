<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Session}} on {{.Host}}</title>
<link rel="stylesheet" href="/page.css">
</head>
<body>
<header>
  <h1>{{.Session}}</h1>
  <p class="host">on {{.Host}}</p>
</header>
<ol id="transcript" data-host="{{.Host}}" data-session="{{.Session}}" data-cursor="{{.Cursor}}">
{{- range .Rows}}
  <li class="row" data-seq="{{.Seq}}" data-kind="{{.Kind}}">
    <p class="title">{{.Title}}</p>
    {{- if or .Text .Appendable}}
    <pre class="text">{{.Text}}</pre>
    {{- end}}
    {{- if .Detail}}
    <p class="detail">{{.Detail}}</p>
    {{- end}}
  </li>
{{- end}}
</ol>
<script src="/page.js"></script>
</body>
</html>
