<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Session}} on {{.Host}}</title>
<link rel="stylesheet" href="/page.css">
</head>
<body data-host-state="Connecting">
<header>
  <h1>{{.Session}}</h1>
  <p class="host">
    on {{.Host}} · <span id="host-state">Connecting</span>
    <span id="host-cause"></span>
    <span class="mark" id="host-mark">connecting</span>
    <time id="stale"></time>
  </p>
  <p class="state" id="state" data-state="{{.State}}">{{.State}}{{if .Reason}} {{.Reason}}{{end}}</p>
  <section class="vendors" aria-labelledby="vendors-title">
    <h2 id="vendors-title">Vendors</h2>
    <ul id="vendors"></ul>
  </section>
</header>
<ol id="transcript" data-host="{{.Host}}" data-session="{{.Session}}" data-cursor="{{.Cursor}}">
{{- range .Rows}}
  <li class="row" data-seq="{{.Seq}}" data-kind="{{.Kind}}">
    <p class="title">{{.Title}}</p>
    {{- if or .Text .Appendable}}
    <pre class="text">{{.Text}}</pre>
    {{- end}}
    {{- if .Detail}}
    <p class="detail">{{.Detail}}</p>
    {{- end}}
  </li>
{{- end}}
</ol>
<script type="application/json" id="events">{{.Events}}</script>
<script src="/fold.js"></script>
<script src="/render.js"></script>
<script src="/page.js"></script>
</body>
</html>
